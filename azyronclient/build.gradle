/*
 * AZYRON CLIENT — Fabric mod build script.
 *
 * Builds the installable client mod JAR:
 *   ./gradlew build
 *
 * The resulting JAR (build/libs/azyronclient-<version>.jar) is a Fabric
 * mod for Minecraft 1.21.11 and works on desktop (Windows / Linux / macOS)
 * and inside PojavLauncher (Android / iOS).
 */

plugins {
    // Loom 1.13 reads the unpick metadata shipped with yarn. (1.14 requires
    // Gradle 9.2; 1.13 is the newest line working on Gradle 8.14.)
    id 'fabric-loom' version '1.13.+'
    id 'maven-publish'
}

/* ---------------------------------------------------------------------------
 * AZYRON CLIENT V2 — multi-version build.
 *
 * ONE product, ONE feature set; the Minecraft-specific toolchain pins live in
 * gradle/versions/<mc>.properties and the Minecraft-version-specific input
 * shims live in src/compat/<profile>/java (selected by mc_profile):
 *
 *   modern = Minecraft 1.21.9 .. 1.21.11  (Click / KeyInput / CharInput API)
 *   legacy = Minecraft 1.21   .. 1.21.8   (classic mouse/key/char callbacks)
 *
 * Default build targets 1.21.11 (the latest stable). CI builds every entry in
 * gradle/versions/*.properties and produces one jar + mrpack per target:
 *     ./gradlew build -Pmc_version=1.21.4
 * ------------------------------------------------------------------------- */
def mcVersion = (project.findProperty('mc_version') ?: project.findProperty('minecraft_version') ?: '1.21.11').toString()
def versionsFile = file("gradle/versions/${mcVersion}.properties")
if (!versionsFile.exists()) {
    throw new GradleException("No toolchain definition for Minecraft ${mcVersion} — " +
            "expected gradle/versions/${mcVersion}.properties")
}
def vprops = new Properties()
versionsFile.withInputStream { vprops.load(it) }
def req = { String key ->
    def value = vprops.getProperty(key)
    if (value == null || value.trim().isEmpty()) {
        throw new GradleException("gradle/versions/${mcVersion}.properties is missing '${key}'")
    }
    return value.trim()
}
def mcProfile = req('mc_profile')
if (!(mcProfile in ['modern', 'legacy'])) {
    throw new GradleException("gradle/versions/${mcVersion}.properties: mc_profile must be 'modern' or 'legacy'")
}

ext {
    minecraft_version = req('minecraft_version')
    yarn_mappings = req('yarn_mappings')
    loader_version = req('loader_version')
    fabric_api_version = req('fabric_api_version')
    java_version = req('java_version')
    mc_profile = mcProfile
    minecraft_dep = req('minecraft_dep')
}

sourceSets {
    main {
        java {
            srcDir "src/compat/${mc_profile}/java"
        }
    }
}

base {
    archivesName = project.archives_base_name
}

version = "${project.mod_version}+mc${mcVersion}"
group = project.maven_group

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

loom {
    // NOTE: single (client) source set — everything in src/main/java is
    // client-only, which is the common Loom setup for client mods.
    mixin {
        defaultRefmapName = 'azyronclient.refmap.json'
    }
    // Read-only access to three private members resolved at compile time.
    accessWidenerPath = file('src/main/resources/azyronclient.accesswidener')
}

dependencies {
    // Yarn-mapped Minecraft + Fabric toolchain.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Gson is bundled with Minecraft at runtime.
    implementation 'com.google.code.gson:gson:2.10.1'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_dep', project.minecraft_dep

    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'minecraft_dep': project.minecraft_dep
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(project.java_version)
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs += ['-Xlint:-options']
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Prints the resolved pins — useful in CI logs.
tasks.register('printPins') {
    doLast {
        println "minecraft_version=${project.minecraft_version}"
        println "yarn_mappings=${project.yarn_mappings}"
        println "loader_version=${project.loader_version}"
        println "fabric_api_version=${project.fabric_api_version}"
        println "mc_profile=${project.mc_profile}"
        println "minecraft_dep=${project.minecraft_dep}"
        println "archive_version=${project.version}"
    }
}
