# ---------------------------------------------------------------------------
# AZYRON CLIENT — gradle.properties
#
# Minecraft / Fabric versions are pinned here. tools/update_pins.py
# (run by CI and recommended locally) rewrites these four values to the
# latest published Fabric versions for the target Minecraft release, so
# they are always valid even if this file was committed with stale pins.
# ---------------------------------------------------------------------------

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# Target Minecraft version. 1.21.11 ONLY.
minecraft_version=1.21.11

# Yarn mappings build for 1.21.11 (verify at https://fabricmc.net/develop/).
yarn_mappings=1.21.11+build.1

# Fabric Loader version (verify at https://fabricmc.net/use/).
loader_version=0.17.2

# Fabric API version for 1.21.11 (verify at https://modrinth.com/mod/fabric-api).
fabric_api_version=0.129.0+1.21.11

# Mod metadata
mod_version=1.0.0
maven_group=com.jiggneshgaming
archives_base_name=azyronclient

# Java toolchain — Minecraft 1.21.x requires Java 21.
java_version=21
